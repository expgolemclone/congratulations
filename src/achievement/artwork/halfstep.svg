<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 120 840 400" role="img" aria-label="A victory-lap bicycle celebrating your achievement, shown from the side"><style>.bk-ground{stroke:rgba(23, 24, 26, .16);stroke-width:2}
